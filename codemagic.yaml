workflows:
  ios-build:
    name: CalorieNaija iOS Build
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Restructure project files
        script: |
          mkdir -p CalorieNaija.xcodeproj
          mkdir -p CalorieNaija/Assets.xcassets/AppIcon.appiconset
          mv project.pbxproj CalorieNaija.xcodeproj/
          mv CalorieNaijaApp.swift CalorieNaija/
          mv ContentView.swift CalorieNaija/
          mv Info.plist CalorieNaija/
          mv icon-1024.png CalorieNaija/Assets.xcassets/AppIcon.appiconset/
          mv Contents.json CalorieNaija/Assets.xcassets/AppIcon.appiconset/
          echo '{"info":{"version":1,"author":"xcode"}}' > CalorieNaija/Assets.xcassets/Contents.json
      - name: Build archive
        script: |
          xcodebuild archive \
            -project CalorieNaija.xcodeproj \
            -scheme CalorieNaija \
            -archivePath build/CalorieNaija.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
    artifacts:
      - build/*.xcarchive
